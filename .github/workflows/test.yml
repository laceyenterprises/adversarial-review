name: Test

# LAC-2164 native-build reproduction lane (diagnostic branch only; never merged).
# Dispatch: gh workflow run test.yml --repo laceyenterprises/adversarial-review --ref lac-2164-native-repro
# Repeats `npm ci` under Node 22.23.4 on ubuntu-24.04 (the CI image where fs-ext 2.1.1 intermittently
# fails to see V8 declarations) and keeps the evidence the normal workflow discards: toolchain versions,
# node-gyp verbose output, and fingerprints of the installed headers. Two modes: `as-ci` mirrors the
# Test workflow exactly (setup-node npm cache, default node-gyp devdir); `isolated` gives node-gyp a
# fresh per-job devdir.

on:
  workflow_dispatch:

concurrency:
  group: lac-2164-repro-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repro:
    name: npm ci repro (Node 22.23.4, ${{ matrix.mode }} ${{ matrix.i }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [as-ci, isolated]
        i: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Toolchain
        run: |
          set -x
          node -v; npm -v; uname -a; cat /etc/os-release | head -4
          gcc --version | head -1; g++ --version | head -1; python3 --version
          node -p 'JSON.stringify(process.release)'
          node -p 'process.versions.v8'
          ls -la "$HOME/.cache/node-gyp" 2>/dev/null || echo "no default node-gyp devdir before install"

      - name: npm ci (verbose, foreground scripts)
        id: ci
        continue-on-error: true
        env:
          npm_config_loglevel: verbose
          npm_config_foreground_scripts: 'true'
        run: |
          if [ "${{ matrix.mode }}" = isolated ]; then export npm_config_devdir="$RUNNER_TEMP/node-gyp-devdir"; fi
          npm ci 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"
          exit "${PIPESTATUS[0]}"

      - name: Header fingerprint
        if: always()
        run: |
          OUT="$RUNNER_TEMP/evidence"; mkdir -p "$OUT"
          cp "$RUNNER_TEMP/npm-ci.log" "$OUT/" 2>/dev/null || true
          echo "ci outcome: ${{ steps.ci.outcome }}" > "$OUT/outcome.txt"
          for D in "$HOME/.cache/node-gyp" "$RUNNER_TEMP/node-gyp-devdir"; do
            [ -d "$D" ] || continue
            tag=$(basename "$D")
            find "$D" -type f | sort > "$OUT/$tag.files.txt"
            find "$D" -type f -name '*.h' -print0 | sort -z | xargs -0 sha256sum > "$OUT/$tag.headers.sha256" || true
            for h in v8-isolate.h v8-function.h v8-statistics.h; do
              f=$(find "$D" -name "$h" | head -1); [ -n "$f" ] || continue
              { echo "== $f"; wc -c "$f"; grep -n -E 'class V8_EXPORT HeapStatistics|enum class ConstructorBehavior|#include' "$f" | head -40; } >> "$OUT/$tag.key-headers.txt"
            done
            ls -la --time-style=full-iso -R "$D" | head -400 > "$OUT/$tag.ls.txt"
          done
          ls -la "$OUT"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lac-2164-repro-${{ matrix.mode }}-${{ matrix.i }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Fail the job when npm ci failed
        if: steps.ci.outcome == 'failure'
        run: exit 1
