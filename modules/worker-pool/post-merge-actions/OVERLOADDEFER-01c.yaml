      SRE: after both OVERLOADDEFER-01c repositories deploy normally, verify a
      sanctioned rescue --apply on a Comment-only PR at load at or below
      approximately two per core dispatches its closer without an
      overload-deferred receipt. Retain deployed SHAs, load, launch ID and
      ownership receipt. The companion agent-os report documents acceptance;
      this plan executes no live dispatch or restart.
