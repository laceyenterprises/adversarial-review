operator_steps:
  - description: From the deployed review-service root, set DEPLOYED_AT_UTC to the deployment timestamp (UTC ISO 8601). Inspect natural exact-head Comment-only reviews with findings in Agent OS or set REVIEW_REPO to another managed repository. Acceptance requires an observed final findings route and zero carried-clean-head or daemon-merge observations for the sampled reviewed heads.
    run_as: Service operator with read access to the deployed review store and GitHub
    command: |
      set -e
      : "${DEPLOYED_AT_UTC:?Set the start of the strict-mode deployment window in UTC}"
      node --input-type=module -e '
        import { loadConfigCached } from "./src/config-loader.mjs";
        if (loadConfigCached().getMergeAuthorityConfig().strictMode !== true) {
          throw new Error("strict mode must be enabled for this observation");
        }
      '
      since=$(node -e '
        const since = Date.parse(process.argv[1]);
        if (!Number.isFinite(since)) throw new Error("invalid DEPLOYED_AT_UTC");
        console.log(since);
      ' "$DEPLOYED_AT_UTC")
      journal=data/next-action-shadow/observations.jsonl
      set -- "$journal"
      if [ -r "$journal.1" ]; then set -- "$journal.1" "$journal"; fi
      jq -se --argjson since "$since" --arg repo "${REVIEW_REPO:-laceyenterprises/agent-os}" '
        [.[] | select(.schema == "merge-lane-observation/v1" and .repo == $repo
          and .strictMode == true and .observedAtMs >= $since
          and .exactReview.verdict == "comment-only" and .exactReview.hasFindings == true)]
        | if any(.[]; .next.reason == "carried-clean-head" or .next.action == "daemon-merge") then
            error("unexpected daemon route for an exact-head review with findings")
          elif any(.[]; .next.action == "hammer" and .next.reason == "review-findings-final") then .
          else error("acceptance pending: no matching final findings observation") end
      ' "$@"
