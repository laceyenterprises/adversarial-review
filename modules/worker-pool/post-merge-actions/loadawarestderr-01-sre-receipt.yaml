# Operator-owned activation receipt; no automated live change.
operator_steps:
  - description: >-
      After the owned submodule floats and watcher/follow-up processes restart
      through the normal deployment procedure, SRE retains a natural hammer
      run showing no repeated [load-aware-timeout] CPU sample unavailable
      messages on helper steps with LOAD_AWARE_TIMEOUT_DEBUG unset. Confirm
      PR 1776's closer passes local validation for
      test/finalization-queue-gsr.test.mjs on the macOS host. If that PR has
      already settled or the test is absent on its current head, record that
      fact and retain an equivalent current-head exact-stderr validation
      receipt. Record loaded revisions and evidence before acknowledging.
      This worker performs no float, restart, closer dispatch or live change.
    run_as: designated SRE operator
    command: >-
      /usr/bin/printf '%s\n' 'LOADAWARESTDERR-01: after float and watcher/follow-up restart, retain hammer logs without repeated CPU sample unavailable messages and PR 1776 closer exact-stderr local validation evidence.'
actions: []
catchup:
  catchup_timeout_s: 1800
contact_on_failure: operator
