operator_steps:
  - description: >-
      After both reviewed revisions deploy and the review-service float,
      restart the registered watcher and follow-up services through the documented
      deployment path.
      Retain deployed SHAs and watcher/follow-up PIDs and start times proving the new revision
      is loaded. Verify Grok remediation routing stays opt-in and disabled by
      default and the closer stays refused under the narrowed OVERLOADDEFER-01b scope. Observe a naturally deferred rescue receipt advancing or
      launching within one directory rotation including queued due receipts,
      bounded child execution and applicable per-PR backoff; affected PRs must acquire a closer
      or released owner without manual pumping. Coordinate the incident-PR
      checks with the companion Agent OS handoff. This plan executes no live
      repair and source fixtures do not establish deployed acceptance.
    run_as: designated SRE operator
    command: /bin/cat changes/OVERLOADDEFER-01b.md
actions: []
catchup:
  catchup_timeout_s: 1800
contact_on_failure: operator
